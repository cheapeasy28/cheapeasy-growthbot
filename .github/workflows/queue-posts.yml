name: CheapEasy Growthbot — daily scheduled queue

on:
  workflow_dispatch:
  schedule:
    - cron: '37 8 * * *'

permissions:
  contents: write

concurrency:
  group: cheapeasy-growthbot-queue
  cancel-in-progress: false

jobs:
  queue-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check content and optionally queue
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          LIVE_POSTING: ${{ vars.LIVE_POSTING }}
          BUFFER_ORG_ID: ${{ vars.BUFFER_ORG_ID }}
          PINTEREST_BOARD_ID: ${{ vars.PINTEREST_BOARD_ID }}
        run: python schedule_posts.py
      - name: Record posts already queued successfully
        run: |
          if ! git diff --quiet -- state/posted.json; then
            git config user.name 'cheapeasy-growthbot[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state/posted.json
            git commit -m 'Track queued Buffer posts [skip ci]'
            git push
          else
            echo 'Nothing to commit'
          fi
